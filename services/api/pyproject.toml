[project]
name = "bhaav-api"
version = "0.1.0"
description = "Bhaav inference API: FastAPI + ONNX Runtime. No torch, no transformers (ADR-001)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "regex>=2024.5",
    "tokenizers>=0.20",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Only for building the random-weight development model (bhaav_api.devtools.dummy_model).
dummy = ["onnx>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bhaav_api"]
