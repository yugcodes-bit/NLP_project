[project]
name = "bhaav-workspace"
version = "0.1.0"
description = "Bhaav — Hinglish emotion detection. Monorepo root (not a distributable package)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "bhaav",
    "bhaav-api[dummy]",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
    "types-PyYAML>=6.0",
    "types-regex>=2024.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ml", "services/api"]

[tool.uv.sources]
bhaav = { workspace = true }
bhaav-api = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
# Bare names here match a directory of that name anywhere in the tree, so do not add "data":
# it would silently skip the whole bhaav.data package. node_modules/dist/.venv are default excludes.
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
# RUF001-003 flag "ambiguous" unicode; this project is full of intentional Devanagari and emoji.
# SIM905 rewrites "a b c".split() into a list literal; word lists read better as one string.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["bhaav", "bhaav_api"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "ml/src,services/api"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["datasketch.*", "onnx.*", "onnxruntime.*", "pyarrow.*", "sklearn.*", "tokenizers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["ml/tests", "services/api/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: needs a real trained model or network; excluded from the default PR run",
]

[tool.coverage.run]
branch = true
source = ["ml/src/bhaav", "services/api/bhaav_api"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
