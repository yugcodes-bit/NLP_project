[project]
name = "bhaav"
version = "0.1.0"
description = "Bhaav ML pipeline: data harmonisation, training, evaluation, export."
requires-python = ">=3.11,<3.12"
# Phase 1 needs the data pipeline only. torch / transformers arrive with the training code
# (Phase 4) as an optional extra so data and CI jobs stay light.
dependencies = [
    "datasketch>=1.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "regex>=2024.5",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhaav"]
